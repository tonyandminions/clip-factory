name: clip

on:
  push:
    paths: ["jobs/**.json"]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Job file(s) under jobs/, space separated"
        required: true

concurrency:
  group: clip-${{ github.sha }}
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Pick job files
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES="${{ github.event.inputs.jobs }}"
          else
            FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/*.json' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Jobs: $FILES"

      - name: Install tools
        if: steps.pick.outputs.files != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q yt-dlp faster-whisper
          ffmpeg -hide_banner -decoders | grep -i dav1d || true

      - name: Cache whisper model
        if: steps.pick.outputs.files != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en

      - name: Run jobs
        if: steps.pick.outputs.files != ''
        run: python3 scripts/run_job.py ${{ steps.pick.outputs.files }}

      - name: Upload outputs
        if: steps.pick.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: |
            out/*/*_post.mp4
            out/*/*_HQ.mp4
            out/*/transcript.txt
            out/*/caps.json
            out/*/sheet.jpg
            out/*/preview.jpg
          retention-days: 7
