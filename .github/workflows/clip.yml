name: clip

on:
  push:
    paths: ["jobs/**.json"]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Job file(s) under jobs/, space separated"
        required: true

concurrency:
  group: clip-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Expand job files into one runner per clip
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILES="${{ github.event.inputs.jobs }}"
          else
            FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/*.json' | tr '\n' ' ')
          fi
          echo "Jobs: $FILES"
          python3 - $FILES <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          items = []
          for f in sys.argv[1:]:
              d = json.load(open(f)); d = d if isinstance(d, list) else [d]
              items += [{"file": f, "i": i, "name": j.get("name", f"job{i}")} for i, j in enumerate(d)]
          print("matrix=" + json.dumps(items))
          PY

  clip:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-btbn-gpl-v1

      - name: Install tools
        run: |
          # static ffmpeg from GitHub (apt mirrors sometimes hang for 10+ min)
          if [ ! -x ~/ffmpeg/bin/ffmpeg ]; then
            mkdir -p ~/ffmpeg
            curl -sSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C ~/ffmpeg --strip-components=1
          fi
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          ~/ffmpeg/bin/ffmpeg -hide_banner -version | head -1
          pip install -q yt-dlp faster-whisper

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en

      - name: Run job
        run: |
          python3 -c "import json,sys; d=json.load(open('${{ matrix.file }}')); d=d if isinstance(d,list) else [d]; json.dump(d[${{ matrix.i }}], open('/tmp/job.json','w'))"
          CLIP_WORKERS=1 python3 scripts/run_job.py /tmp/job.json

      - name: Publish small outputs to the 'out' branch
        run: |
          RUN="run-${{ github.run_number }}"
          mkdir -p /tmp/pub/$RUN
          for d in out/*/; do n=$(basename "$d"); mkdir -p /tmp/pub/$RUN/$n
            cp "$d"/*_post.mp4 "$d"/*_HQ.mp4 "$d"/sheet.jpg "$d"/preview.jpg "$d"/transcript.txt "$d"/caps.json /tmp/pub/$RUN/$n/ 2>/dev/null || true; done
          git config user.name "clip-factory-bot"; git config user.email "actions@users.noreply.github.com"
          rm -rf out
          for attempt in 1 2 3 4 5 6; do
            git fetch -q --depth=1 origin out && git checkout -q -f -B out origin/out
            cp -r /tmp/pub/$RUN/. ./$RUN/ 2>/dev/null || { mkdir -p ./$RUN; cp -r /tmp/pub/$RUN/. ./$RUN/; }
            git add "$RUN" && git commit -qm "outputs $RUN ${{ matrix.name }}" || true
            if git push -q origin out; then echo "Published to branch out/$RUN"; break; fi
            sleep $((attempt * 3))
          done
